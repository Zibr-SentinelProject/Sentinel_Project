<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel | {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="header">
    <div class="container">
      <a class="brand" href="/">Sentinel<span>.</span></a>
      <nav class="nav">
        <a href="/incidents">Incidencias</a>
        <a class="btn" href="/login">Iniciar sesión</a>
      </nav>
    </div>
  </header>
  {% endblock %}

  {% block content %}{% endblock %}

  {% block footer %}
  <footer class="footer">Sentinel &middot; Wara, Yaxche &amp; Dani</footer>
  {% endblock %}
</body>
</html>
