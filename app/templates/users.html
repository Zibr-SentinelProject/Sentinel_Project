{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}
<main>
  <section class="section">
    <div class="container">
      <h1>Users</h1>

      <table class="table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th></tr>
        </thead>
        <tbody>
          {% for listed in users %}
          <tr>
            <td>{{ listed.name }}</td>
            <td>{{ listed.email }}</td>
            <td>
              <form class="filters row-form" method="post" action="/users/{{ listed.id }}/role">
                <select name="role">
                  {% for role in roles %}
                  <option value="{{ role }}" {{ 'selected' if listed.get_role() == role }}>{{ role }}</option>
                  {% endfor %}
                </select>
                <button class="btn" type="submit">Save</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
</main>
{% endblock %}
